version: "3.9"

# ─────────────────────────────────────────────────────────────────────────────
# Apex-SOC — Full-stack Docker Compose
# Usage:  docker compose up --build
#         docker compose up -d          (detached)
#         docker compose logs -f        (tail logs)
# ─────────────────────────────────────────────────────────────────────────────

networks:
  soc-net:
    driver: bridge

services:

  # ──────────────────────────────────────
  # Backend — FastAPI / Uvicorn
  # ──────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: apex-soc-backend
    restart: unless-stopped
    networks:
      - soc-net
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONDONTWRITEBYTECODE=1
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    # Resource limits
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M

  # ──────────────────────────────────────
  # Frontend — React (built) + Nginx
  # ──────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: apex-soc-frontend
    restart: unless-stopped
    networks:
      - soc-net
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:80/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 128M
